<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Enrollment Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="courseName"></h1>
    <h2 id="courseCode"></h2>

    <div class="controls">
        <label for="sectionNumber">Section Number</label>
        <input id="sectionNumber" type="number" />
        <button id="enrollStudent">Enroll Student</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Section#</th>
                <th>Room#</th>
                <th>#Enrolled</th>
                <th>Days</th>
                <th>Instructor</th>
            </tr>
        </thead>
        <tbody id="sections"></tbody>
    </table>

    <script src="main.js"></script>
</body>
</html>

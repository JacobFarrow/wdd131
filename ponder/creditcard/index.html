<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>Checkout</h1></header>
    <main>
        <div id="errorBox" class="errors"></div>
        <form id="checkoutForm">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" required>

            <label for="email">Email:</label>
            <input type="email" id="email" required>

            <label for="address">Address:</label>
            <textarea id="address" rows="4" required></textarea>

            <label for="paymentMethod">Payment Method:</label>
            <select id="paymentMethod" required>
                <option value="">Select Payment Method</option>
                <option value="creditCard">Credit Card</option>
                <option value="paypal">PayPal</option>
            </select>

            <div id="creditCardContainer" class="hide">
                <label for="cardNumber">Credit Card Number:</label>
                <input type="text" id="cardNumber" placeholder="Enter 16 digits">
                
                <label>Expiration</label>
                <div class="exp-group">
                    <input type="number" id="month" placeholder="MM">
                    <input type="number" id="year" placeholder="YY">
                </div>
            </div>

            <div id="paypalContainer" class="hide">
                <label for="paypalUsername">PayPal Username:</label>
                <input type="text" id="paypalUsername">
            </div>

            <button type="submit">Place Order</button>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>

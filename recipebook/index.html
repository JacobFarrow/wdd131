<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeBook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <img src="images/images/recipe-book.png" alt="Recipe Book Logo" class="logo-icon">
            <h1>RECIPEBOOK</h1>
        </div>
    </header>

    <main id="recipe-container">
        <form id="search-form" class="search-bar">
            <input type="text" id="search-input" placeholder="Find a recipe">
            <button type="submit"><img src="images/images/search.svg" alt="Search"></button>
        </form>
    </main>

    <footer>
        <div class="social">
            <a href="#"><img src="images/images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>
        <p>
            <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
        </p>
    </footer>

    <script src="script.js"></script>
</body>
</html>

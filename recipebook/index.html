<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeBook | Apple Crisp</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <meta property="og:type" content="website">
    <meta property="og:title" content="RecipeBook - Delicious Apple Crisp">
    <meta property="og:description" content="Find the best fall dessert recipes, starting with our simple yet delicious Apple Crisp.">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="images/images/apple-crisp.jpg">

    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="RecipeBook - Apple Crisp">
    <meta name="twitter:description" content="A simple yet delicious fall dessert served warm with vanilla ice cream.">
    <meta name="twitter:image" content="images/images/apple-crisp.jpg">

    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="images/images/apple-touch-icon.png">
</head>
<body>
    <header>
        <div class="logo-area">
            <img src="images/images/recipe-book.png" alt="Recipe Book Logo" class="logo-icon">
            <h1>RECIPEBOOK</h1>
        </div>
    </header>

    <main>
        <form id="search-form" class="search-bar">
            <input type="text" id="search-input" placeholder="Find a recipe">
            <button type="submit"><img src="images/images/search.svg" alt="Search"></button>
        </form>

        <article class="recipe-card">
            <div class="recipe-image">
                <img src="images/images/apple-crisp.jpg" alt="Bowl of Apple Crisp with ice cream">
            </div>
            
            <div class="recipe-content">
                <span class="tag">dessert</span>
                <h2>Apple Crisp</h2>
                
                <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star-empty">☆</span>
                </span>

                <p class="description">
                    This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.
                </p>
            </div>
        </article>
    </main>

    <footer>
        <div class="social">
            <a href="#"><img src="images/images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>
        <p>
            <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
        </p>
    </footer>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Form</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2090%22>💳</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <form id="creditCardForm">
            <div class="card">
                <div class="logo">💳</div>
                
                <div class="full-width">
                    <label for="cardNumber">CARD NUMBER</label>
                    <input type="text" id="cardNumber" maxlength="16" placeholder="1234123412341234" required>
                </div>

                <div class="half-width">
                    <label for="cardHolder">CARD HOLDER</label>
                    <input type="text" id="cardHolder" placeholder="NAME SURNAME" required>
                </div>

                <div id="cardExpiration" class="quarter-width">
                    <label id="expirationDate">EXPIRATION</label>
                    <div class="exp-group">
                        <input type="text" id="month" name="expMonth" placeholder="MM" maxlength="2" aria-labelledby="expirationDate" required>
                        <span>/</span>
                        <input type="text" id="year" name="expYear" placeholder="YY" maxlength="2" aria-labelledby="expirationDate" required>
                    </div>
                </div>
            </div>
            <button type="submit">Submit Payment</button>
            <p id="feedback"></p>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
